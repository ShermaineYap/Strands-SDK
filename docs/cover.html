<!doctype html><html><head><meta charset="utf-8"><style>

</style></head><body>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2430"/><stop offset="1" stop-color="#163848"/></linearGradient>

  <rect width="1200" height="675" fill="url(#sky)"/>

    <line x1="0" y1="170" x2="1200" y2="170" stroke="#e74c3c"/>

    <line x1="0" y1="390" x2="1200" y2="390" stroke="#f1c40f"/>

  <path d="M0 470 C120 400 230 430 330 380 C450 320 540 410 650 370 C780 320 880 400 1000 350 C1090 315 1150 340 1200 330 L1200 675 L0 675Z" fill="url(#hill1)" opacity=".9"/>
  <path d="M0 540 C150 500 260 530 380 490 C520 445 640 520 780 480 C920 440 1040 500 1200 470 L1200 675 L0 675Z" fill="url(#hill2)"/>

  <path d="M0 470 C120 468 200 466 280 455 C380 440 440 400 520 345 C600 290 650 230 720 190 C780 158 820 150 860 168 C920 196 980 260 1060 330 C1120 380 1160 405 1200 415 L1200 675 L0 675Z" fill="url(#water)"/>

  <g fill="#e8f7fd">
    <circle cx="80" cy="469" r="5"/><circle cx="160" cy="467" r="5"/><circle cx="240" cy="461" r="5"/><circle cx="320" cy="447" r="5"/>

    <circle cx="620" cy="268" r="7" fill="#f39c12"/><circle cx="700" cy="200" r="9" fill="#e74c3c"/><circle cx="780" cy="160" r="9" fill="#e74c3c"/>
    <circle cx="860" cy="168" r="7" fill="#e74c3c"/><circle cx="940" cy="210" r="6"/><circle cx="1020" cy="290" r="5"/><circle cx="1100" cy="370" r="5"/>
  </g>
  <!-- verification ticks at band crossings -->
  <g fill="none" stroke="#2ecc71" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="470" cy="383" r="20" stroke-width="3"/>
    <circle cx="545" cy="326" r="20" stroke-width="3" opacity=".0"/>
    <circle cx="700" cy="200" r="24" stroke-width="3"/>
  </g>
  <!-- phone with message bubbles (no text) -->
  <g transform="translate(905,420)">
    <rect x="0" y="0" width="170" height="300" rx="26" fill="#0b1820" stroke="#7fd3f0" stroke-width="4"/>
